<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Talk to Riya — NoirFlow AI Demo</title>
<meta name="description" content="Have a live spoken conversation with Riya, NoirFlow's AI sales assistant." />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --accent: #22d3ee; /* electric cyan-blue accent */
  }
  html, body {
    height: 100%;
    background: #000;
    overscroll-behavior: none;
  }
  /* Pulsing rings while listening */
  .mic-listening {
    position: relative;
  }
  .mic-listening::before,
  .mic-listening::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 9999px;
    border: 2px solid var(--accent);
    animation: pulse-ring 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  .mic-listening::after {
    animation-delay: 0.5s;
  }
  @keyframes pulse-ring {
    0% { transform: scale(0.95); opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  /* Gentle breathing while thinking / speaking */
  .mic-thinking,
  .mic-speaking {
    animation: breathe 1.1s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .mic-speaking {
    box-shadow: 0 0 0 10px rgba(34, 211, 238, 0.18);
  }
  #transcript::-webkit-scrollbar { width: 4px; }
  #transcript::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
</style>
</head>
<body class="bg-black text-white">
<noscript>
  <div class="p-6 text-center text-white">This demo requires JavaScript to be enabled.</div>
</noscript>

<div class="flex flex-col mx-auto max-w-md" style="height: 100dvh; min-height: 100vh;">

  <!-- Header -->
  <header class="shrink-0 flex items-center justify-between px-5 pt-[env(safe-area-inset-top,1rem)] pt-4 pb-3 border-b border-neutral-800">
    <div>
      <p class="text-xs uppercase tracking-[0.2em] text-neutral-500">NoirFlow</p>
      <h1 class="text-lg font-semibold">Talk to Riya <span aria-hidden="true">🦷</span></h1>
    </div>
    <span class="text-[10px] px-2 py-1 rounded-full border border-cyan-400/40 text-cyan-300">AI DEMO</span>
  </header>

  <!-- Transcript -->
  <main id="transcript" class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
    <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center text-neutral-500 px-6">
      <p class="text-sm">Tap the mic below and say "Hi" — Riya will explain what NoirFlow builds and how it can help your business.</p>
    </div>
  </main>

  <!-- Mic control -->
  <section class="shrink-0 flex flex-col items-center gap-3 py-6 px-6">
    <p id="status-text" class="text-sm text-neutral-400 h-5 text-center">Tap to talk to Riya</p>
    <button
      id="mic-btn"
      type="button"
      aria-label="Tap to talk to Riya"
      class="relative w-24 h-24 rounded-full bg-neutral-900 border-2 border-cyan-400 flex items-center justify-center active:scale-95 transition-transform"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="w-9 h-9 text-cyan-300" aria-hidden="true">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 11a7 7 0 0 1-14 0M12 19v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <p id="unsupported-msg" class="hidden text-xs text-red-400 text-center max-w-xs">
      Voice demo requires Chrome on Android or desktop.
    </p>
  </section>

  <!-- Always-visible CTA -->
  <a
    id="book-call-btn"
    href="https://calendly.com/noirflow/discovery-call"
    target="_blank"
    rel="noopener noreferrer"
    class="shrink-0 block text-center bg-cyan-400 text-black font-semibold py-4 mx-4 mb-4 rounded-xl active:scale-[0.98] transition-transform"
    style="margin-bottom: max(1rem, env(safe-area-inset-bottom));"
  >
    📅 Book a call with Anshuman
  </a>
  <!-- TODO: replace the href above with NoirFlow's real Calendly (or booking) link before sending this to prospects. -->

</div>

<script>
(function () {
  'use strict';

  var transcript = document.getElementById('transcript');
  var emptyState = document.getElementById('empty-state');
  var micBtn = document.getElementById('mic-btn');
  var statusText = document.getElementById('status-text');
  var unsupportedMsg = document.getElementById('unsupported-msg');

  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var speechSupported = Boolean(SpeechRecognitionCtor) && Boolean(window.speechSynthesis);

  var uiState = 'idle'; // idle | listening | thinking | speaking | unsupported
  var recognition = null;
  var finalTranscript = '';
  var lastErrorMessage = '';
  var liveBubbleEl = null;
  var conversationHistory = []; // [{ role: 'user' | 'assistant', text }]

  function setState(next, message) {
    uiState = next;
    micBtn.classList.remove('mic-listening', 'mic-thinking', 'mic-speaking');
    if (next === 'listening') micBtn.classList.add('mic-listening');
    if (next === 'thinking') micBtn.classList.add('mic-thinking');
    if (next === 'speaking') micBtn.classList.add('mic-speaking');
    if (typeof message === 'string') statusText.textContent = message;
  }

  function clearEmptyState() {
    if (emptyState && emptyState.parentNode) {
      emptyState.parentNode.removeChild(emptyState);
    }
  }

  function appendBubble(role, text) {
    clearEmptyState();
    var wrapper = document.createElement('div');
    wrapper.className = 'flex w-full ' + (role === 'user' ? 'justify-start' : 'justify-end');
    var bubble = document.createElement('div');
    bubble.className = 'max-w-[78%] rounded-2xl px-4 py-2 text-sm leading-relaxed whitespace-pre-wrap ' +
      (role === 'user'
        ? 'bg-neutral-800 text-white rounded-bl-sm'
        : 'bg-cyan-400/10 border border-cyan-400/40 text-cyan-50 rounded-br-sm');
    bubble.textContent = text;
    wrapper.appendChild(bubble);
    transcript.appendChild(wrapper);
    transcript.scrollTop = transcript.scrollHeight;
    return bubble;
  }

  function ensureLiveBubble() {
    if (liveBubbleEl) return;
    liveBubbleEl = appendBubble('user', '…');
    liveBubbleEl.classList.add('opacity-60', 'italic');
  }

  function updateLiveBubble(text) {
    if (!liveBubbleEl) ensureLiveBubble();
    liveBubbleEl.textContent = text || '…';
    transcript.scrollTop = transcript.scrollHeight;
  }

  function finalizeLiveBubble(text) {
    if (!liveBubbleEl) {
      appendBubble('user', text);
      return;
    }
    liveBubbleEl.textContent = text;
    liveBubbleEl.classList.remove('opacity-60', 'italic');
    liveBubbleEl = null;
  }

  function removeLiveBubbleIfEmpty() {
    if (liveBubbleEl) {
      var wrapper = liveBubbleEl.parentElement;
      if (wrapper && wrapper.parentElement) wrapper.parentElement.removeChild(wrapper);
      liveBubbleEl = null;
    }
  }

  // --- Text-to-speech ---------------------------------------------------

  var cachedVoices = [];
  function loadVoices() {
    cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pickIndianVoice() {
    if (!cachedVoices.length) return null;
    return (
      cachedVoices.find(function (v) { return v.lang === 'en-IN'; }) ||
      cachedVoices.find(function (v) { return /india/i.test(v.name) || /hindi/i.test(v.name); }) ||
      cachedVoices.find(function (v) { return v.lang && v.lang.indexOf('en') === 0; }) ||
      null
    );
  }

  function speak(text) {
    if (!window.speechSynthesis) {
      setState('idle', 'Tap to talk to Riya');
      return;
    }
    window.speechSynthesis.cancel();
    var utterance = new SpeechSynthesisUtterance(text);
    var voice = pickIndianVoice();
    if (voice) utterance.voice = voice;
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.onstart = function () { setState('speaking', 'Riya is speaking…'); };
    utterance.onend = function () { setState('idle', 'Tap to talk to Riya'); };
    utterance.onerror = function () { setState('idle', 'Tap to talk to Riya'); };
    window.speechSynthesis.speak(utterance);
  }

  // --- Talking to the backend --------------------------------------------

  function sendToRiya(text) {
    setState('thinking', 'Riya is thinking…');
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: conversationHistory }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error('Request failed with status ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var reply = data && typeof data.reply === 'string' ? data.reply : "Sorry, I'm having trouble connecting right now.";
        conversationHistory.push({ role: 'user', text: text });
        conversationHistory.push({ role: 'assistant', text: reply });
        appendBubble('assistant', reply);
        speak(reply);
      })
      .catch(function (err) {
        console.error('[riya-voice] Failed to reach Riya:', err);
        var fallback = "Sorry, I'm having trouble connecting right now.";
        appendBubble('assistant', fallback);
        speak(fallback);
      });
  }

  // --- Speech recognition -------------------------------------------------

  function startListening() {
    finalTranscript = '';
    lastErrorMessage = '';

    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'en-IN';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onresult = function (event) {
      var interim = '';
      var final = '';
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var t = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          final += t;
        } else {
          interim += t;
        }
      }
      if (final) finalTranscript += final;
      updateLiveBubble((finalTranscript + interim).trim());
    };

    recognition.onerror = function (event) {
      console.error('[riya-voice] SpeechRecognition error:', event.error);
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        lastErrorMessage = 'Mic permission denied — please allow microphone access.';
      } else if (event.error === 'no-speech') {
        lastErrorMessage = "Didn't catch that — tap to try again.";
      } else if (event.error === 'aborted') {
        lastErrorMessage = '';
      } else {
        lastErrorMessage = 'Something went wrong — tap to try again.';
      }
    };

    recognition.onend = function () {
      var text = finalTranscript.trim();
      if (text) {
        finalizeLiveBubble(text);
        sendToRiya(text);
      } else {
        removeLiveBubbleIfEmpty();
        setState('idle', lastErrorMessage || 'Tap to talk to Riya');
      }
    };

    setState('listening', 'Listening…');
    ensureLiveBubble();
    try {
      recognition.start();
    } catch (err) {
      console.error('[riya-voice] Failed to start recognition:', err);
      removeLiveBubbleIfEmpty();
      setState('idle', 'Tap to talk to Riya');
    }
  }

  function stopListening() {
    if (recognition) recognition.stop();
  }

  // --- Wiring ---------------------------------------------------------

  if (!speechSupported) {
    setState('unsupported', 'Voice demo requires Chrome on Android or desktop.');
    micBtn.disabled = true;
    micBtn.classList.add('opacity-40', 'cursor-not-allowed');
    unsupportedMsg.classList.remove('hidden');
  } else {
    micBtn.addEventListener('click', function () {
      if (uiState === 'thinking') return;
      if (uiState === 'listening') {
        stopListening();
        return;
      }
      if (uiState === 'speaking') {
        window.speechSynthesis.cancel();
      }
      startListening();
    });
  }
})();
</script>
</body>
</html>
