<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Focus Loop</title>
<meta name="description" content="Anshuman's personal AI focus coach, classroom, and NoirFlow advisor." />
<script>
  // Light-first: only switch to dark if the user explicitly chose it before.
  (function () {
    try {
      if (localStorage.getItem('focusloop.darkMode') === 'true') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<style>
  html, body {
    background: #ffffff;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
  html.dark, html.dark body { background: #0a0a0a; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 9999px; }
  html.dark ::-webkit-scrollbar-thumb { background: #262626; }

  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { opacity: 0; animation: fade-in-up 0.35s ease-out forwards; }

  #timer-ring { transition: stroke-dashoffset 0.2s linear; }

  .tab-pill { transition: background-color 150ms ease, color 150ms ease; }

  .chat-bubble-user { border-radius: 10px 10px 2px 10px; }
  .chat-bubble-coach { border-radius: 10px 10px 10px 2px; }

  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-2px); opacity: 0.9; }
  }
  .typing-dot { animation: typing-bounce 1.2s ease-in-out infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }

  .modal-content { transition: opacity 200ms ease-out, transform 200ms ease-out; }
</style>
</head>
<body class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-50 min-h-screen transition-colors duration-300">
<noscript>
  <div class="p-6 text-center">Focus Loop requires JavaScript to be enabled.</div>
</noscript>

<!-- Modal -->
<div id="modal-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 dark:bg-black/60 backdrop-blur-sm p-4" onclick="if(event.target===this) closeModal();">
  <div id="modal-content" class="modal-content opacity-0 translate-y-2 bg-white dark:bg-neutral-900 rounded-[10px] border border-gray-200 dark:border-neutral-800 shadow-lg max-w-[480px] w-full max-h-[85vh] overflow-y-auto" role="dialog" aria-modal="true"></div>
</div>

<!-- Top Nav -->
<header class="sticky top-0 z-30 bg-white/95 dark:bg-neutral-950/95 backdrop-blur border-b border-gray-200 dark:border-neutral-800 transition-colors duration-300">
  <div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
    <span class="font-extrabold text-lg text-indigo-600 dark:text-indigo-400 tracking-tight">Focus Loop</span>
    <div class="flex items-center gap-1.5">
      <span id="streak-badge" class="text-xs font-medium text-gray-500 dark:text-neutral-400 mr-1">🔥 0 day streak</span>
      <button type="button" onclick="toggleSound()" class="text-gray-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-50 hover:bg-gray-50 dark:hover:bg-neutral-900 rounded-lg p-2 transition-colors" aria-label="Toggle sound">
        <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <svg id="icon-sound-off" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      </button>
      <button type="button" onclick="toggleDarkMode()" class="text-gray-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-50 hover:bg-gray-50 dark:hover:bg-neutral-900 rounded-lg p-2 transition-colors" aria-label="Toggle dark mode">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </div>
  <!-- Tab pills -->
  <div class="max-w-lg mx-auto px-4 pb-3">
    <div class="flex gap-1.5 bg-gray-50 dark:bg-neutral-900 rounded-lg p-1">
      <button data-tab="focus" onclick="switchTab('focus')" class="tab-pill flex-1 text-sm font-semibold py-1.5 rounded-lg bg-indigo-600 text-white">Focus</button>
      <button data-tab="classroom" onclick="switchTab('classroom')" class="tab-pill flex-1 text-sm font-semibold py-1.5 rounded-lg text-gray-500 dark:text-neutral-400">Classroom</button>
      <button data-tab="advisor" onclick="switchTab('advisor')" class="tab-pill flex-1 text-sm font-semibold py-1.5 rounded-lg text-gray-500 dark:text-neutral-400">Advisor</button>
    </div>
  </div>
</header>

<main class="max-w-lg mx-auto px-4 pb-16">

<!-- ===================== FOCUS TAB ===================== -->
<section id="panel-focus" class="pt-5">

  <!-- Timer ring -->
  <div class="relative w-56 h-56 mx-auto mt-2">
    <svg viewBox="0 0 200 200" class="w-56 h-56 -rotate-90">
      <circle cx="100" cy="100" r="90" stroke-width="10" class="fill-none stroke-gray-100 dark:stroke-neutral-800"/>
      <circle id="timer-ring" cx="100" cy="100" r="90" stroke-width="10" stroke-linecap="round" class="fill-none stroke-indigo-600 dark:stroke-indigo-500"/>
    </svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center px-8 text-center">
      <span id="timer-phase-label" class="text-[11px] font-semibold uppercase tracking-wide text-gray-400 dark:text-neutral-500 mb-1">Ready</span>
      <span id="timer-display" class="text-4xl font-bold tabular-nums text-neutral-900 dark:text-neutral-50">25:00</span>
      <span id="timer-goal-label" class="text-xs text-gray-500 dark:text-neutral-400 mt-1.5 leading-snug line-clamp-2"></span>
    </div>
  </div>

  <!-- STATE A: Ready -->
  <div id="focus-state-ready" class="mt-6 fade-in">
    <label class="block text-base font-semibold text-neutral-900 dark:text-neutral-50 mb-2">What are you working on?</label>
    <textarea id="sprint-goal" rows="2" placeholder="e.g. Draft the Master Skin Clinic follow-up DM" class="w-full text-sm bg-gray-50 dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-lg px-3 py-2.5 text-neutral-800 dark:text-neutral-100 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:outline-none focus:ring-2 focus:ring-indigo-600/20 focus:border-indigo-400 transition-colors resize-none"></textarea>
    <label class="block text-xs text-gray-400 dark:text-neutral-500 mt-3 mb-1.5">Where were you leaking time before this? (optional)</label>
    <input id="sprint-leak" type="text" placeholder="Instagram, YouTube, anxiety scroll..." class="w-full text-sm bg-gray-50 dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-lg px-3 py-2 text-neutral-800 dark:text-neutral-100 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:outline-none focus:ring-2 focus:ring-indigo-600/20 focus:border-indigo-400 transition-colors" />
    <button onclick="startSprint()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3 rounded-lg transition-colors">Start 25 min sprint</button>
  </div>

  <!-- STATE B: In sprint -->
  <div id="focus-state-sprint" class="mt-6 hidden fade-in">
    <div id="kickoff-message" class="text-sm text-neutral-700 dark:text-neutral-300 bg-indigo-50 dark:bg-indigo-500/10 border border-indigo-100 dark:border-indigo-500/20 rounded-[10px] px-3.5 py-3 mb-4 leading-relaxed"></div>
    <div class="flex gap-2">
      <button id="pause-btn" onclick="togglePauseSprint()" class="flex-1 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 text-neutral-800 dark:text-neutral-200 font-semibold text-sm py-2.5 rounded-lg transition-colors hover:bg-gray-50 dark:hover:bg-neutral-800">Pause</button>
      <button onclick="giveUpSprint()" class="flex-1 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 text-red-600 dark:text-red-400 font-semibold text-sm py-2.5 rounded-lg transition-colors hover:bg-red-50 dark:hover:bg-red-500/10">Give up</button>
    </div>
  </div>

  <!-- Break phase -->
  <div id="focus-state-break" class="mt-6 hidden fade-in text-center">
    <p class="text-sm text-gray-500 dark:text-neutral-400 mb-4">Short break. Stand up, breathe, don't open Instagram.</p>
    <button onclick="skipBreak()" class="text-xs font-medium text-gray-400 dark:text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-200 underline">Skip break</button>
  </div>

  <!-- STATE C: Review -->
  <div id="focus-state-review" class="mt-6 hidden fade-in">
    <p class="text-base font-semibold text-neutral-900 dark:text-neutral-50 mb-3">How did it go?</p>
    <div class="grid grid-cols-3 gap-2" id="outcome-buttons">
      <button data-outcome="Nailed" onclick="pickOutcome('Nailed')" class="outcome-btn flex flex-col items-center gap-1 py-3 rounded-[10px] border-2 border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 transition-colors">
        <span class="text-xl">✅</span><span class="text-xs font-medium text-neutral-700 dark:text-neutral-300">Nailed</span>
      </button>
      <button data-outcome="Partial" onclick="pickOutcome('Partial')" class="outcome-btn flex flex-col items-center gap-1 py-3 rounded-[10px] border-2 border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 transition-colors">
        <span class="text-xl">⚠️</span><span class="text-xs font-medium text-neutral-700 dark:text-neutral-300">Partial</span>
      </button>
      <button data-outcome="Failed" onclick="pickOutcome('Failed')" class="outcome-btn flex flex-col items-center gap-1 py-3 rounded-[10px] border-2 border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 transition-colors">
        <span class="text-xl">❌</span><span class="text-xs font-medium text-neutral-700 dark:text-neutral-300">Failed</span>
      </button>
    </div>
    <textarea id="review-reason" rows="2" placeholder="One sentence why? (optional)" class="w-full mt-3 text-sm bg-gray-50 dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-lg px-3 py-2.5 text-neutral-800 dark:text-neutral-100 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:outline-none focus:ring-2 focus:ring-indigo-600/20 focus:border-indigo-400 transition-colors resize-none"></textarea>
    <button onclick="submitReview()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3 rounded-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed" id="submit-review-btn" disabled>Submit</button>
    <div id="review-response" class="mt-3 text-sm text-neutral-700 dark:text-neutral-300 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-100 dark:border-emerald-500/20 rounded-[10px] px-3.5 py-3 hidden leading-relaxed"></div>
  </div>

  <!-- Today's log -->
  <div class="mt-8">
    <div class="flex items-center justify-between mb-2.5">
      <h2 class="text-sm font-bold text-neutral-900 dark:text-neutral-50">Today</h2>
      <span id="today-count" class="text-xs text-gray-400 dark:text-neutral-500"></span>
    </div>
    <div id="today-log" class="bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-[10px] divide-y divide-gray-100 dark:divide-neutral-800 overflow-hidden"></div>
    <button id="end-day-btn" onclick="openEndOfDayReview()" class="hidden mt-3 w-full bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 text-neutral-800 dark:text-neutral-200 font-semibold text-sm py-2.5 rounded-lg transition-colors hover:bg-gray-50 dark:hover:bg-neutral-800">End day + get pattern analysis</button>
  </div>

  <!-- Week view -->
  <div class="mt-8 mb-4">
    <h2 class="text-sm font-bold text-neutral-900 dark:text-neutral-50 mb-2.5">This week</h2>
    <div id="week-view" class="grid grid-cols-7 gap-1.5"></div>
  </div>

</section>

<!-- ===================== CLASSROOM TAB ===================== -->
<section id="panel-classroom" class="pt-5 hidden">

  <div id="classroom-picker">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-base font-semibold text-neutral-900 dark:text-neutral-50">Today's Lesson</h2>
      <button onclick="suggestTopic()" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300">Suggest topic for me</button>
    </div>
    <div id="topic-grid" class="grid grid-cols-2 gap-2.5"></div>
  </div>

  <div id="classroom-lesson" class="hidden mt-2">
    <button onclick="backToTopics()" class="text-xs font-medium text-gray-400 dark:text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-200 mb-3 flex items-center gap-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Topics
    </button>
    <div class="bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-[10px] p-4">
      <p id="lesson-topic-label" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 uppercase tracking-wide mb-2"></p>
      <div id="lesson-content" class="text-sm text-neutral-700 dark:text-neutral-300"></div>
    </div>
    <div class="flex gap-2 mt-3">
      <button id="mark-learned-btn" onclick="markLessonLearned()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-2.5 rounded-lg transition-colors">Mark as learned</button>
      <button onclick="toggleFollowUp()" class="flex-1 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 text-neutral-800 dark:text-neutral-200 font-semibold text-sm py-2.5 rounded-lg transition-colors hover:bg-gray-50 dark:hover:bg-neutral-800">Ask a follow-up</button>
    </div>
    <div id="follow-up-box" class="hidden mt-3">
      <div id="follow-up-thread" class="space-y-2 mb-2"></div>
      <div class="flex gap-2">
        <input id="follow-up-input" type="text" placeholder="Ask a clarifying question..." class="flex-1 text-sm bg-gray-50 dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-lg px-3 py-2 text-neutral-800 dark:text-neutral-100 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:outline-none focus:ring-2 focus:ring-indigo-600/20 focus:border-indigo-400 transition-colors" onkeydown="if(event.key==='Enter') sendFollowUp();" />
        <button onclick="sendFollowUp()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-3.5 rounded-lg transition-colors">Ask</button>
      </div>
    </div>
  </div>

  <div class="mt-8 mb-4">
    <button onclick="toggleLessonHistory()" class="w-full flex items-center justify-between text-sm font-bold text-neutral-900 dark:text-neutral-50 mb-2.5">
      <span>Past lessons</span>
      <svg id="lesson-history-chevron" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="lesson-history" class="hidden bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-[10px] divide-y divide-gray-100 dark:divide-neutral-800 overflow-hidden"></div>
  </div>

</section>

<!-- ===================== ADVISOR TAB ===================== -->
<section id="panel-advisor" class="pt-5 hidden flex flex-col" style="min-height: calc(100vh - 130px);">

  <div class="flex items-center justify-between mb-3">
    <button onclick="togglePastSessions()" class="text-xs font-medium text-gray-400 dark:text-neutral-500 hover:text-neutral-700 dark:hover:text-neutral-200">Past sessions</button>
    <button onclick="newAdvisorSession()" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300">New session</button>
  </div>

  <div id="past-sessions-list" class="hidden bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-[10px] divide-y divide-gray-100 dark:divide-neutral-800 overflow-hidden mb-3"></div>

  <div id="advisor-chat" class="flex-1 space-y-3 mb-3 overflow-y-auto"></div>

  <div id="advisor-quick" class="grid grid-cols-2 gap-1.5 mb-2.5">
    <button onclick="sendAdvisorMessage('What should I build next?')" class="text-xs font-medium text-left text-neutral-700 dark:text-neutral-300 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-lg px-2.5 py-2 hover:bg-gray-50 dark:hover:bg-neutral-800 transition-colors">What should I build next?</button>
    <button onclick="sendAdvisorMessage('How do I handle this client situation?')" class="text-xs font-medium text-left text-neutral-700 dark:text-neutral-300 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-lg px-2.5 py-2 hover:bg-gray-50 dark:hover:bg-neutral-800 transition-colors">Handle a client situation</button>
    <button onclick="sendAdvisorMessage('Review my current strategy.')" class="text-xs font-medium text-left text-neutral-700 dark:text-neutral-300 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-lg px-2.5 py-2 hover:bg-gray-50 dark:hover:bg-neutral-800 transition-colors">Review my strategy</button>
    <button onclick="sendAdvisorMessage('What am I ignoring right now?')" class="text-xs font-medium text-left text-neutral-700 dark:text-neutral-300 bg-white dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-lg px-2.5 py-2 hover:bg-gray-50 dark:hover:bg-neutral-800 transition-colors">What am I ignoring?</button>
  </div>

  <div class="sticky bottom-0 bg-white dark:bg-neutral-950 pt-1 pb-4 flex gap-2">
    <input id="advisor-input" type="text" placeholder="Ask your co-founder..." class="flex-1 text-sm bg-gray-50 dark:bg-neutral-900 border border-gray-200 dark:border-neutral-800 rounded-lg px-3 py-2.5 text-neutral-800 dark:text-neutral-100 placeholder:text-gray-400 dark:placeholder:text-neutral-500 focus:outline-none focus:ring-2 focus:ring-indigo-600/20 focus:border-indigo-400 transition-colors" onkeydown="if(event.key==='Enter') sendAdvisorMessage();" />
    <button onclick="sendAdvisorMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-4 rounded-lg transition-colors">Send</button>
  </div>

</section>

</main>

<script>
/* =========================================================
   CONSTANTS + PROMPTS
   ========================================================= */
const BASE_SYSTEM_PROMPT = `You are Focus Loop — Anshuman Tripathy's personal AI coach, classroom teacher, and NoirFlow business advisor. You are NOT a generic AI. You know him deeply. Speak like a mentor who has watched him build for months and has skin in his success.

ABOUT ANSHUMAN:
- 19 years old, first-year college student in Bhubaneswar, Odisha, India
- Founder of NoirFlow AI, an AI + digital infrastructure agency
- Co-founder: Somyaranjan Sahoo (supportive friend, not operator)
- Operates entirely from Android phone using Claude Pro + Claude Code — no laptop, no external budget
- Getting laptop around Feb 2027; until then in build-not-sell mode
- Access pattern: online in stretches (some days, 3-4 hrs at uncle's, 6-7 day full windows every 45 days), offline for 15-45 day academic periods

NOIRFLOW CURRENT STATE:
- Live: 3 portfolio sites (Smile Dental, Aurum Realty, FitZone Gym scaffolded)
- Live: AI receptionist 'Riya' — WhatsApp/Telegram, Hinglish, Gemini brain, Supabase memory, Google Sheets logging
- Live: Smart Clinic Dashboard — multi-industry demo with tabs (Overview, Website, AI Agents, Automations, AI Systems), dark mode, business switcher
- Offer ladder: Website Starter, Website + AI Receptionist (Growth), Full AI System (Premium) — prices TBD
- Prospect list: 16 dental/skin clinics across BBSR, Cuttack, Puri in Notion Command Center
- Sent first cold DM to Master Skin Clinic; hasn't sent follow-up wave yet — offline windows make cold outreach hard right now
- Sales OS docs, Notion Command Center, English-first outreach scripts all built

HIS MENTALITY (be aware, don't coddle):
- Ambitious: wants to be multi-crore founder by 30
- Compares self to peers with supercars — poisoning himself on Instagram
- Perfectionist: gets distracted building when should sell
- Pattern he named: 'I chase complex tools when simple ones work'
- Pattern he named: 'I get distracted by building when I should sell'
- Wants brutally honest feedback, no soft-pedaling
- Wants to be pushed back on when about to make bad calls
- Responds to direct, decisive guidance — never lists of options
- Handles technical depth fine — never dumb things down
- Under pressure: ships hard, executes when things break

YOUR VOICE:
- Direct and decisive. Never hedge. Never 'it depends'.
- Warm but firm. You care because you have skin in this.
- Never generic. Every response ties to his specific reality.
- Push back when he's wrong. Don't cave just because he pushed once.
- Celebrate real wins specifically (not generic hype).
- Match his energy — fast when he's fast, real when he's stuck.
- Never soften bad news.
- Phrase things as 'our business' / 'we're doing' for NoirFlow.

You are three things in one:
1. His FOCUS COACH during sprints
2. His CLASSROOM TEACHER for daily learning
3. His NOIRFLOW ADVISOR for business questions`;

const TOPICS = [
  { name: 'AI & Tech', icon: '🤖' },
  { name: 'Business & Sales', icon: '💼' },
  { name: 'Personal Brand & Positioning', icon: '✨' },
  { name: 'Finance & Money Mindset', icon: '💰' },
  { name: 'Founder Mental Game', icon: '🧠' },
  { name: 'Tools Deep Dive', icon: '🛠️' },
];

const SPRINT_SECONDS = 25 * 60;
const BREAK_SECONDS = 5 * 60;
const RING_RADIUS = 90;
const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

const FALLBACKS = {
  kickoff: '25 minutes. One thing. Go.',
  end: 'Logged. Next.',
  lesson: 'Coach offline. Try again.',
  advisor: 'Offline. Retry.',
  eod: 'Analysis unavailable. Try again in a bit.',
  followup: 'Coach offline. Try again.',
};

/* =========================================================
   STORAGE HELPERS
   ========================================================= */
function getLS(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? fallback : JSON.parse(v);
  } catch (e) {
    return fallback;
  }
}
function setLS(key, value) {

/* =========================================================
   GENERIC UTILS
   ========================================================= */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayStr(d) {
  const date = d || new Date();
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}
function formatClock(seconds) {
  const s = Math.max(0, Math.ceil(seconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}
function truncate(str, n) {
  if (!str) return '';
  return str.length > n ? str.slice(0, n - 1) + '…' : str;
}
function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* =========================================================
   GEMINI CALL
   ========================================================= */
async function callGemini({ prompt, history, useSearch }) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ systemPrompt: BASE_SYSTEM_PROMPT, prompt, history, useSearch: !!useSearch }),
  });
  if (!res.ok) throw new Error('API error ' + res.status);
  const data = await res.json();
  if (!data.reply) throw new Error('Empty reply');
  return data.reply.trim();
}

function toggleDarkMode() {

function updateThemeIcon() {
  const isDark = document.documentElement.classList.contains('dark');

function updateSoundIcon() {

function playChime(freq) {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.42);
  } catch (e) {}
}
function vibrate(pattern) {
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) {}
}

/* =========================================================
   TIMER ENGINE (Focus tab)
   ========================================================= */
function elapsedSeconds(t) {
  const effectiveNow = t.paused ? t.pausedAt : Date.now();
  return (effectiveNow - t.startTime) / 1000;
}
function saveTimer() {
  setLS('focusloop.currentSprint', timer);
}
function clearTimer() {
  timer = null;
  setLS('focusloop.currentSprint', null);
}
function setRingProgress(remaining, duration) {
  const ring = document.getElementById('timer-ring');
  const progress = Math.max(0, Math.min(1, remaining / duration));
  ring.style.strokeDasharray = RING_CIRCUMFERENCE;
  ring.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - progress);
}

function tick() {
  if (!timer) return;
  const remaining = timer.duration - elapsedSeconds(timer);
  document.getElementById('timer-display').textContent = formatClock(remaining);
  setRingProgress(remaining, timer.duration);
  if (remaining <= 0) {
    onPhaseComplete();
    return;
  }
  rafHandle = requestAnimationFrame(tick);
}

function startSprint() {
  const goalEl = document.getElementById('sprint-goal');
  const leakEl = document.getElementById('sprint-leak');
  const goal = goalEl.value.trim();
  if (!goal) {
    goalEl.focus();
    return;
  }
  const leak = leakEl.value.trim();
  timer = { phase: 'sprint', goal, leak, startTime: Date.now(), duration: SPRINT_SECONDS, paused: false, pausedAt: null, kickoffMessage: '' };
  saveTimer();
  renderFocusPhase();
  fetchKickoff(goal, leak);
  if (rafHandle) cancelAnimationFrame(rafHandle);
  tick();
}

async function fetchKickoff(goal, leak) {
  const box = document.getElementById('kickoff-message');
  box.innerHTML = '<span class="typing-dot inline-block w-1.5 h-1.5 rounded-full bg-indigo-400 mr-1"></span><span class="typing-dot inline-block w-1.5 h-1.5 rounded-full bg-indigo-400 mr-1"></span><span class="typing-dot inline-block w-1.5 h-1.5 rounded-full bg-indigo-400"></span>';
  const prompt = `${BASE_SYSTEM_PROMPT}
MODE: Focus Coach.
Anshuman just started a 25-min sprint. Goal: '${goal}'.
Time-leak he reported before starting: '${leak || 'none reported'}'.
Give a 1-2 sentence kickoff message. Specific to his goal and NoirFlow context. Direct. Warm. No fluff. No emoji. End with a period.`;
  let msg;
  try {
    msg = await callGemini({ prompt });
  } catch (e) {
    msg = FALLBACKS.kickoff;
  }
  if (timer && timer.phase === 'sprint') {
    timer.kickoffMessage = msg;
    saveTimer();
    box.textContent = msg;
  }
}

function togglePauseSprint() {
  if (!timer) return;
  const btn = document.getElementById('pause-btn');
  if (timer.paused) {
    const pausedDuration = Date.now() - timer.pausedAt;
    timer.startTime += pausedDuration;
    timer.paused = false;
    timer.pausedAt = null;
    btn.textContent = 'Pause';
    saveTimer();
    if (rafHandle) cancelAnimationFrame(rafHandle);
    tick();
  } else {
    timer.paused = true;
    timer.pausedAt = Date.now();
    btn.textContent = 'Resume';
    saveTimer();
  }
}

function giveUpSprint() {
  if (!timer) return;
  if (rafHandle) cancelAnimationFrame(rafHandle);
  const t = timer;
  clearTimer();
  enterReviewState(t.goal, t.leak, t.kickoffMessage || '');
}

function onPhaseComplete() {
  if (rafHandle) cancelAnimationFrame(rafHandle);
  if (!timer) return;
  if (timer.phase === 'sprint') {
    playChime(880);
    vibrate([200, 80, 200]);
    const t = timer;
    clearTimer();
    enterReviewState(t.goal, t.leak, t.kickoffMessage || '');
  } else if (timer.phase === 'break') {
    playChime(660);
    vibrate([150]);
    clearTimer();
    renderFocusPhase();
  }
}

function skipBreak() {
  if (rafHandle) cancelAnimationFrame(rafHandle);
  clearTimer();
  renderFocusPhase();
}

let pendingReview = { goal: '', leak: '', kickoffMessage: '', outcome: null };

function enterReviewState(goal, leak, kickoffMessage) {
  pendingReview = { goal, leak, kickoffMessage, outcome: null };
  document.getElementById('review-reason').value = '';
  document.getElementById('review-response').classList.add('hidden');

  document.getElementById('timer-display').textContent = '--:--';

async function submitReview() {
  if (!pendingReview.outcome) return;
  const reason = document.getElementById('review-reason').value.trim();
  const btn = document.getElementById('submit-review-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  const prompt = `${BASE_SYSTEM_PROMPT}
MODE: Focus Coach.
Anshuman just finished a 25-min sprint on '${pendingReview.goal}'. He marked it '${pendingReview.outcome}' and said: '${reason || 'no reason given'}'.
Give ONE sentence response. Max 20 words. If nailed: brief acknowledgment. If partial: name adjustment. If failed: real, not soft. No shaming.`;

  let endMessage;
  try {
    endMessage = await callGemini({ prompt });
  } catch (e) {
    endMessage = FALLBACKS.end;
  }

  const now = new Date();
  sprints.push({
    id: uid(),
    date: todayStr(now),
    time: now.toTimeString().slice(0, 5),
    goal: pendingReview.goal,
    leak: pendingReview.leak,
    outcome: pendingReview.outcome,

  responseBox.textContent = endMessage;
  responseBox.classList.remove('hidden');

  renderTodayLog();

  setTimeout(() => {
    timer = { phase: 'break', goal: '', leak: '', startTime: Date.now(), duration: BREAK_SECONDS, paused: false, pausedAt: null };
    saveTimer();
    renderFocusPhase();
    if (rafHandle) cancelAnimationFrame(rafHandle);

function showFocusState(state) {
  document.getElementById('focus-state-ready').classList.toggle('hidden', state !== 'ready');
  document.getElementById('focus-state-sprint').classList.toggle('hidden', state !== 'sprint');
  document.getElementById('focus-state-break').classList.toggle('hidden', state !== 'break');
  document.getElementById('focus-state-review').classList.toggle('hidden', state !== 'review');
}

function renderFocusPhase() {
  if (timer && timer.phase === 'sprint') {
    document.getElementById('timer-phase-label').textContent = 'Focus';
    document.getElementById('timer-goal-label').textContent = truncate(timer.goal, 60);
    document.getElementById('kickoff-message').textContent = timer.kickoffMessage || '';
    document.getElementById('pause-btn').textContent = timer.paused ? 'Resume' : 'Pause';
    showFocusState('sprint');
  } else if (timer && timer.phase === 'break') {
    document.getElementById('timer-phase-label').textContent = 'Break';
    document.getElementById('timer-goal-label').textContent = '';
    showFocusState('break');
  } else {
    document.getElementById('timer-phase-label').textContent = 'Ready';
    document.getElementById('timer-display').textContent = formatClock(SPRINT_SECONDS);
    document.getElementById('timer-goal-label').textContent = '';
    setRingProgress(SPRINT_SECONDS, SPRINT_SECONDS);
    showFocusState('ready');
    const goalEl = document.getElementById('sprint-goal');
    goalEl.value = '';
    document.getElementById('sprint-leak').value = '';
    try { goalEl.focus(); } catch (e) {}
  }
}

function recoverTimerOnLoad() {
  if (!timer) {
    renderFocusPhase();
    return;
  }
  const remaining = timer.duration - elapsedSeconds(timer);
  if (remaining <= 0) {
    // Phase already finished while we were away.
    if (timer.phase === 'sprint') {
      const t = timer;
      clearTimer();
      enterReviewState(t.goal, t.leak, t.kickoffMessage || '');
    } else {
      clearTimer();
      renderFocusPhase();
    }
    return;
  }
  renderFocusPhase();
  tick();
}

const OUTCOME_ICON = { Nailed: '✅', Partial: '⚠️', Failed: '❌' };

function renderTodayLog() {
  const today = todayStr();

  const logEl = document.getElementById('today-log');

      </div>`
      )
      .join('');
  }

  document.getElementById('end-day-btn').classList.toggle('hidden', todaySprints.length < 3);
}

function computeStreak() {
  let streak = 0;
  const d = new Date();
  for (let i = 0; i < 365; i++) {
    const dateStr = todayStr(d);
    const count = sprints.filter((s) => s.date === dateStr).length;
    if (i === 0) {
      if (count >= 3) streak++;
    } else {
      if (count >= 3) streak++;
      else break;
    }
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function renderStreak() {
  const streak = computeStreak();
  setLS('focusloop.streak', streak);
  document.getElementById('streak-badge').textContent = '🔥 ' + streak + ' day streak';
}

function dayColorClass(daySprints) {
  if (!daySprints.length) return 'bg-gray-100 dark:bg-neutral-800 text-gray-400 dark:text-neutral-500';
  if (daySprints.length < 3) return 'bg-red-100 dark:bg-red-500/10 text-red-500 dark:text-red-400 animate-pulse';
  const nailed = daySprints.filter((s) => s.outcome === 'Nailed').length;
  const ratio = nailed / daySprints.length;
  if (ratio >= 0.66) return 'bg-emerald-100 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400';
  if (ratio >= 0.34) return 'bg-amber-100 dark:bg-amber-500/10 text-amber-700 dark:text-amber-400';
  return 'bg-red-100 dark:bg-red-500/10 text-red-600 dark:text-red-400';
}

function renderWeekView() {
  const wrap = document.getElementById('week-view');
  const cells = [];
  const d = new Date();
  d.setDate(d.getDate() - 6);
  for (let i = 0; i < 7; i++) {
    const dateStr = todayStr(d);
    const daySprints = sprints.filter((s) => s.date === dateStr);
    const dayNum = d.getDate();
    const colorClass = dayColorClass(daySprints);
    cells.push(`
      <button onclick="openDayAnalysis('${dateStr}')" class="flex flex-col items-center justify-center py-2.5 rounded-[10px] ${colorClass} transition-colors">
        <span class="text-[10px] font-medium opacity-70">${'SMTWTFS'[d.getDay()]}</span>
        <span class="text-sm font-bold mt-0.5">${dayNum}</span>
      </button>
    `);
    d.setDate(d.getDate() + 1);
  }
  wrap.innerHTML = cells.join('');
}

Anshuman's classroom history (last 7 lessons): ${pastTopicsList()}.
Recent sprint patterns: ${recentSprintSummary()}.
Pick exactly ONE topic from this list that fits what he needs to learn right now: ${TOPICS.map((t) => t.name).join(', ')}.
Reply with ONLY the exact topic name from the list, nothing else.`;

  let picked;
  try {
    const reply = await callGemini({ prompt });
    picked = TOPICS.find((t) => reply.toLowerCase().includes(t.name.toLowerCase()))?.name;
  } catch (e) {
    picked = null;
  }

  btn.textContent = originalText;
  btn.disabled = false;

  if (!picked) {
    const studied = new Set(classroom.map((c) => c.topic));
    picked = TOPICS.find((t) => !studied.has(t.name))?.name || TOPICS[0].name;
  }
  pickTopic(picked);
}

function backToTopics() {
  document.getElementById('classroom-lesson').classList.add('hidden');
  document.getElementById('classroom-picker').classList.remove('hidden');
}

function markLessonLearned() {
  if (currentLessonEntry) {
    currentLessonEntry.learned = true;
    setLS('focusloop.classroom', classroom);
  }
  const btn = document.getElementById('mark-learned-btn');
  btn.textContent = 'Learned ✓';
  btn.disabled = true;
}

function toggleFollowUp() {
  document.getElementById('follow-up-box').classList.toggle('hidden');
  document.getElementById('follow-up-input').focus();
}

async function sendFollowUp() {
  const input = document.getElementById('follow-up-input');
  const question = input.value.trim();
  if (!question || !currentLessonEntry) return;
  input.value = '';

  const thread = document.getElementById('follow-up-thread');
  thread.innerHTML += `<div class="text-sm bg-indigo-600 text-white chat-bubble-user px-3 py-2 ml-8">${escapeHtml(question)}</div>`;
  const loadingId = 'fu-loading-' + uid();
  thread.innerHTML += `<div id="${loadingId}" class="text-sm bg-gray-50 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 chat-bubble-coach px-3 py-2 mr-8"><span class="typing-dot inline-block w-1.5 h-1.5 rounded-full bg-gray-400 mr-1"></span><span class="typing-dot inline-block w-1.5 h-1.5 rounded-full bg-gray-400 mr-1"></span><span class="typing-dot inline-block w-1.5 h-1.5 rounded-full bg-gray-400"></span></div>`;

  const prompt = `${BASE_SYSTEM_PROMPT}
MODE: Classroom teacher (follow-up).
Today's lesson topic: '${currentLessonEntry.topic}'.
Lesson content: ${currentLessonEntry.content}.
Anshuman's follow-up question: '${question}'.
Answer directly in 2-4 sentences. Reference the lesson. No fluff.`;

  let answer;
  try {
    answer = await callGemini({ prompt, useSearch: true });
  } catch (e) {
    answer = FALLBACKS.followup;
  }

  const loadingEl = document.getElementById(loadingId);
  if (loadingEl) loadingEl.outerHTML = `<div class="text-sm bg-gray-50 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 chat-bubble-coach px-3 py-2 mr-8">${escapeHtml(answer)}</div>`;

  currentLessonEntry.followUps.push({ question, answer });
  setLS('focusloop.classroom', classroom);
}

function toggleLessonHistory() {
  const box = document.getElementById('lesson-history');
  const chevron = document.getElementById('lesson-history-chevron');
  const willShow = box.classList.contains('hidden');
  box.classList.toggle('hidden');
  chevron.style.transform = willShow ? 'rotate(180deg)' : 'rotate(0deg)';
}

function renderLessonHistory() {
  const box = document.getElementById('lesson-history');
  if (!classroom.length) {
    box.innerHTML = '<div class="px-4 py-5 text-center text-sm text-gray-400 dark:text-neutral-500">No lessons yet.</div>';
    return;
  }
  const items = [...classroom].reverse();
  box.innerHTML = items
    .map(
      (entry, idx) => `
    <button onclick="reopenLesson(${classroom.length - 1 - idx})" class="w-full text-left px-4 py-3 hover:bg-gray-50 dark:hover:bg-neutral-800 transition-colors flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="text-sm font-medium text-neutral-800 dark:text-neutral-200 truncate">${escapeHtml(entry.topic)}</p>
        <p class="text-xs text-gray-400 dark:text-neutral-500 mt-0.5">${entry.date}</p>
      </div>
      ${entry.learned ? '<span class="text-xs text-emerald-600 dark:text-emerald-400 shrink-0">Learned</span>' : ''}
    </button>`
    )
    .join('');
}

function reopenLesson(index) {
  const entry = classroom[index];
  if (!entry) return;
  currentLessonEntry = entry;
  document.getElementById('classroom-picker').classList.add('hidden');
  document.getElementById('classroom-lesson').classList.remove('hidden');
  document.getElementById('lesson-topic-label').textContent = entry.topic;
  document.getElementById('lesson-content').innerHTML = renderLessonHTML(entry.content);
  document.getElementById('mark-learned-btn').textContent = entry.learned ? 'Learned ✓' : 'Mark as learned';
  document.getElementById('mark-learned-btn').disabled = !!entry.learned;
  document.getElementById('follow-up-box').classList.add('hidden');
  document.getElementById('follow-up-thread').innerHTML = (entry.followUps || [])
    .map(
      (f) => `
    <div class="text-sm bg-indigo-600 text-white chat-bubble-user px-3 py-2 ml-8">${escapeHtml(f.question)}</div>
    <div class="text-sm bg-gray-50 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 chat-bubble-coach px-3 py-2 mr-8">${escapeHtml(f.answer)}</div>`
    )
    .join('');
}

function renderLessonHTML(text) {
  let esc = escapeHtml(text);
  esc = esc.replace(/^#### (.*)$/gm, '<h5 class="font-semibold text-sm mt-3 mb-1">$1</h5>');
  esc = esc.replace(/^### (.*)$/gm, '<h4 class="font-semibold text-sm mt-4 mb-1">$1</h4>');
  esc = esc.replace(/^## (.*)$/gm, '<h3 class="font-bold text-base mt-4 mb-1.5">$1</h3>');
  esc = esc.replace(/^# (.*)$/gm, '<h2 class="font-bold text-lg mt-4 mb-2">$1</h2>');
  esc = esc.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  esc = esc.replace(/^[-*] (.*)$/gm, '<li class="ml-4 list-disc">$1</li>');
  esc = esc.replace(/(<li[^>]*>.*<\/li>\n?)+/g, (m) => '<ul class="my-2 space-y-1">' + m + '</ul>');
  esc = esc
    .split(/\n\n+/)
    .map((block) => {
      if (/^<h[2-5]|^<ul/.test(block.trim())) return block;
      return '<p class="mb-3 leading-relaxed">' + block.replace(/\n/g, '<br>') + '</p>';
    })
    .join('');
  return esc;
}

/* =========================================================
   ADVISOR TAB
   ========================================================= */
function getOrCreateAdvisorSession() {
  if (currentAdvisorSessionId) {
    const existing = advisorSessions.find((s) => s.sessionId === currentAdvisorSessionId);
    if (existing) return existing;
  }
  if (advisorSessions.length) {
    currentAdvisorSessionId = advisorSessions[advisorSessions.length - 1].sessionId;
    return advisorSessions[advisorSessions.length - 1];
  }
  return newAdvisorSession(true);
}

function newAdvisorSession(silent) {
  const session = { sessionId: uid(), date: todayStr(), messages: [] };
  advisorSessions.push(session);
  setLS('focusloop.advisor', advisorSessions);
  currentAdvisorSessionId = session.sessionId;
  renderAdvisorChat();
  if (!silent) document.getElementById('advisor-input').focus();
  return session;
}

function renderAdvisorChat() {
  const session = getOrCreateAdvisorSession();
  const chatEl = document.getElementById('advisor-chat');
  if (!session.messages.length) {
    chatEl.innerHTML = '<p class="text-sm text-gray-400 dark:text-neutral-500 text-center pt-8">Ask me anything about NoirFlow. I know where we actually stand.</p>';
    return;
  }
  chatEl.innerHTML = session.messages
    .map((m) =>
      m.role === 'user'
        ? `<div class="flex justify-end"><div class="max-w-[85%] text-sm bg-indigo-600 text-white chat-bubble-user px-3.5 py-2.5">${escapeHtml(m.content)}</div></div>`
        : `<div class="flex justify-start"><div class="max-w-[85%] text-sm bg-gray-50 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 chat-bubble-coach px-3.5 py-2.5">${escapeHtml(m.content)}</div></div>`
    )
    .join('');
  scrollAdvisorToBottom();
}

function scrollAdvisorToBottom() {
  const chatEl = document.getElementById('advisor-chat');
  chatEl.scrollTop = chatEl.scrollHeight;
}

function todaySprintsSummaryForAdvisor() {
  const today = todayStr();
  const todaySprints = sprints.filter((s) => s.date === today);
  if (!todaySprints.length) return 'No sprints logged today yet.';
  return todaySprints.map((s) => `${s.outcome}: ${s.goal}`).join('; ');
}

async function sendAdvisorMessage(presetText) {
  const input = document.getElementById('advisor-input');
  const message = (presetText !== undefined && typeof presetText === 'string' ? presetText : input.value).trim();
  if (!message) return;
  input.value = '';

  const session = getOrCreateAdvisorSession();
  session.messages.push({ role: 'user', content: message, timestamp: Date.now() });
  setLS('focusloop.advisor', advisorSessions);
  renderAdvisorChat();

  const chatEl = document.getElementById('advisor-chat');
  const loadingId = 'adv-loading-' + uid();
  chatEl.innerHTML += `<div id="${loadingId}" class="flex justify-start"><div class="max-w-[85%] text-sm bg-gray-50 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-300 chat-bubble-coach px-3.5 py-2.5"><span class="typing-dot inline-block w-1.5 h-1.5 rounded-full bg-gray-400 mr-1"></span><span class="typing-dot inline-block w-1.5 h-1.5 rounded-full bg-gray-400 mr-1"></span><span class="typing-dot inline-block w-1.5 h-1.5 rounded-full bg-gray-400"></span></div></div>`;
  scrollAdvisorToBottom();

  const chatHistorySummary = session.messages
    .slice(-8, -1)
    .map((m) => (m.role === 'user' ? 'Anshuman: ' : 'You: ') + m.content)
    .join(' | ') || 'No prior messages this session.';

  const prompt = `${BASE_SYSTEM_PROMPT}
MODE: NoirFlow Business Advisor.
Recent context — today's sprints: ${todaySprintsSummaryForAdvisor()}.
Chat history this session: ${chatHistorySummary}.
Anshuman just asked: '${message}'.

Respond as his co-founder-in-spirit. Direct. Specific to NoirFlow's actual state. Push back if his premise is weak. Cite specifics — his prospects, his offers, his deals, his patterns. If he's about to make a bad call (scope creep, premature building, avoiding sales), stop him. If you don't know something factual (current market rates, new tools), use Google Search to check before answering.

Never generic. Never a list of 5 options unless he asks. Pick a direction, defend it.`;

  const historyForApi = session.messages.slice(0, -1).slice(-10).map((m) => ({ role: m.role, text: m.content }));

  let reply;
  try {
    reply = await callGemini({ prompt, history: historyForApi, useSearch: true });
  } catch (e) {
    reply = FALLBACKS.advisor;
  }

  const loadingEl = document.getElementById(loadingId);
  if (loadingEl) loadingEl.remove();

  session.messages.push({ role: 'assistant', content: reply, timestamp: Date.now() });
  setLS('focusloop.advisor', advisorSessions);
  renderAdvisorChat();
}

function togglePastSessions() {
  const box = document.getElementById('past-sessions-list');
  const willShow = box.classList.contains('hidden');
  box.classList.toggle('hidden');
  if (willShow) {
    if (!advisorSessions.length) {
      box.innerHTML = '<div class="px-4 py-4 text-center text-sm text-gray-400 dark:text-neutral-500">No past sessions yet.</div>';
      return;
    }
    box.innerHTML = [...advisorSessions]
      .reverse()
      .map(
        (s) => `
      <button onclick="loadAdvisorSession('${s.sessionId}')" class="w-full text-left px-4 py-2.5 hover:bg-gray-50 dark:hover:bg-neutral-800 transition-colors flex items-center justify-between gap-2">
        <span class="text-sm text-neutral-700 dark:text-neutral-300">${s.date}</span>
        <span class="text-xs text-gray-400 dark:text-neutral-500">${s.messages.length} msg${s.messages.length === 1 ? '' : 's'}</span>
      </button>`
      )
      .join('');
  }
}

function loadAdvisorSession(sessionId) {
  currentAdvisorSessionId = sessionId;
  renderAdvisorChat();
  document.getElementById('past-sessions-list').classList.add('hidden');
}
